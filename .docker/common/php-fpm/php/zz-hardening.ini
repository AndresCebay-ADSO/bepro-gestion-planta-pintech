; Endurecimiento de PHP para todas las etapas que heredan de `production` (también la de desarrollo).

; No enviar la cabecera `X-Powered-By: PHP/x.y.z`: le diría a un atacante qué versión exacta corre.
expose_php = Off

; Mitigación oficial de CVE-2026-109619 (aviso INCIBE-2026-762). La aplicación no usa el progreso de subida de las
; sesiones nativas de PHP: Laravel maneja sus propias sesiones.
session.upload_progress.enabled = 0
