name: quality

# Comprueba formato, estilo y tipos. Nunca corrige: si algo no cumple, el job falla.
on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

# En los PR, una ejecución por rama: un push nuevo cancela la anterior. En develop y main, un grupo por commit,
# para que ninguna ejecución se cancele ni quede en cola y cada commit fusionado conserve su resultado.
concurrency:
  group: quality-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Wayfinder tipa los parámetros de ruta leyendo el esquema; sin base de datos cae al docblock del modelo y,
    # por ejemplo, el id de rol (`@property int|string $id` en Spatie) pasa de `number` a `string` y tsc falla.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pintech_erp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: pintech_erp
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
          extensions: pdo_pgsql, bcmath

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: 'npm'

      # Se cachean las carpetas instaladas, no solo las descargas: con acierto, no hay que instalar nada.
      - name: Cache de vendor
        id: vendor-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ runner.os }}-php8.3-${{ hashFiles('composer.lock', 'composer.json') }}

      - name: Instalar dependencias PHP
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Cache de node_modules
        id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar dependencias Node
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrar la base de datos
        run: php artisan migrate --force

      # Las rutas tipadas de Wayfinder no están en git: sin ellas, tsc no puede comprobar nada.
      - name: Generar rutas de Wayfinder
        run: php artisan wayfinder:generate --with-form

      - name: Pint (PHP)
        run: ./vendor/bin/pint --test

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint:check

      - name: TypeScript
        run: npm run types:check

      # Bloqueantes desde 2026-09 (partimos de 0 avisos): una vulnerabilidad conocida frena el merge, y el arreglo suele
      # llegar solo como PR de Dependabot. Un paquete abandonado avisa pero no bloquea.
      - name: Auditoría de dependencias PHP
        run: composer audit --no-interaction --abandoned=report

      # `!cancelled()`: se ejecuta aunque falle la auditoría de PHP, para ver los dos resultados en una pasada.
      - name: Auditoría de dependencias Node (producción)
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev

      # Herramientas de compilación y de lint: no llegan al navegador, solo avisan.
      - name: Auditoría de dependencias Node (desarrollo, informativa)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm audit
