# Actualizaciones de dependencias automáticas: cada semana, Dependabot abre PR contra `develop` y el CI los prueba
# en SQLite y PostgreSQL antes del merge. Los parches y las versiones menores se agrupan en un solo PR por ecosistema;
# las versiones mayores llegan por separado, porque pueden romper y hay que revisarlas una a una.
version: 2

updates:
  - package-ecosystem: composer
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/Bogota
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - dependencies
      - php
    groups:
      composer-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/Bogota
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - dependencies
      - javascript
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
      timezone: America/Bogota
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - dependencies
      - ci
